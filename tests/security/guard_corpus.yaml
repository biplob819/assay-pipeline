# SQL guard bypass corpus (Tech Spec §6.1, GRD-08). Every `blocked` entry must be blocked with
# exactly its reason; every `allowed` entry must be allowed, and its rendered SQL must run on a
# DuckDB copy of the approved views. Add every new bypass a verifier finds.
