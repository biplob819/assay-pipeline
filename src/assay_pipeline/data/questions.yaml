# Normal questions, public split (Tech Spec §7.1, §7.4): 24 here, 6 held out
# (heldout/questions.yaml). Gold results are recorded per snapshot manifest (data/gold.json).
questions:
- schema_version: '1.0'
  id: nq-01
  question: How many distinct compounds have at least one visible activity row?
  kind: stat
  gold_sql: SELECT count(DISTINCT inchikey) AS n_compounds FROM v_activities
  rules: &id001
  - B1
  - B2
  - B5
  split: public
- schema_version: '1.0'
  id: nq-02
  question: How many activity rows come from each source?
  kind: stat
  gold_sql: SELECT source, count(*) AS n FROM v_activities GROUP BY source ORDER BY source
  rules: *id001
  split: public
- schema_version: '1.0'
  id: nq-03
  question: What is the median pIC50 over exact (relation '=') measurements?
  kind: stat
  gold_sql: SELECT median(pic50) AS median_pic50 FROM v_activities WHERE relation = '='
  rules: *id001
  split: public
- schema_version: '1.0'
  id: nq-04
  question: How many compounds have a consensus median pIC50 of 8 or more?
  kind: stat
  gold_sql: SELECT count(DISTINCT inchikey) AS n FROM v_consensus WHERE median_pic50 >= 8
  rules: *id001
  split: public
- schema_version: '1.0'
  id: nq-05
  question: Which 5 compounds have the highest consensus median pIC50? Give the InChIKey and the median.
  kind: stat
  gold_sql: SELECT inchikey, median_pic50 FROM v_consensus WHERE median_pic50 IS NOT NULL ORDER BY median_pic50
    DESC, inchikey LIMIT 5
  rules: *id001
  split: public
- schema_version: '1.0'
  id: nq-06
  question: How many activity rows are there per assay type?
  kind: stat
  gold_sql: SELECT assay_type, count(*) AS n FROM v_activities GROUP BY assay_type ORDER BY assay_type
  rules: *id001
  split: public
- schema_version: '1.0'
  id: nq-07
  question: How many consensus keys are in conflict?
  kind: stat
  gold_sql: SELECT count(*) AS n_conflicts FROM v_consensus WHERE conflict
  rules: *id001
  split: public
- schema_version: '1.0'
  id: nq-08
  question: What is the average pIC50 of exact measurements, rounded to 2 decimals?
  kind: stat
  gold_sql: SELECT round(avg(pic50), 2) AS mean_pic50 FROM v_activities WHERE relation = '='
  rules: *id001
  split: public
- schema_version: '1.0'
  id: nq-09
  question: How many distinct assays contributed visible activity rows?
  kind: stat
  gold_sql: SELECT count(DISTINCT assay_id) AS n_assays FROM v_activities
  rules: *id001
  split: public
- schema_version: '1.0'
  id: nq-10
  question: How many rows does each variant have? List variants with their counts.
  kind: stat
  gold_sql: SELECT variant, count(*) AS n FROM v_activities GROUP BY variant ORDER BY n DESC, variant
  rules: *id001
  split: public
- schema_version: '1.0'
  id: nq-11
  question: What is the largest consensus pIC50 spread, and for which compound?
  kind: stat
  gold_sql: SELECT inchikey, spread_pic50 FROM v_consensus WHERE spread_pic50 IS NOT NULL ORDER BY spread_pic50
    DESC, inchikey LIMIT 1
  rules: *id001
  split: public
- schema_version: '1.0'
  id: nq-15
  question: How many visible activity rows have a censored or unknown relation?
  kind: censored
  gold_sql: SELECT count(*) AS n FROM v_activities WHERE relation <> '='
  rules: &id002
  - B1
  - B2
  - B3
  - B5
  split: public
- schema_version: '1.0'
  id: nq-16
  question: Break down the visible rows by relation.
  kind: censored
  gold_sql: SELECT relation, count(*) AS n FROM v_activities GROUP BY relation ORDER BY relation
  rules: *id002
  split: public
- schema_version: '1.0'
  id: nq-17
  question: What is the median pIC50 of all rows, and how does it change if only exact (=) rows are kept?
  kind: censored
  gold_sql: SELECT median(pic50) AS all_rows, median(CASE WHEN relation = '=' THEN pic50 END) AS exact_only
    FROM v_activities
  rules: *id002
  split: public
- schema_version: '1.0'
  id: nq-18
  question: How many compounds have no exact (=) measurement at all, only censored or unknown relations?
  kind: censored
  gold_sql: SELECT count(*) AS n FROM (SELECT inchikey FROM v_activities GROUP BY inchikey HAVING sum(CASE
    WHEN relation = '=' THEN 1 ELSE 0 END) = 0) t
  rules: *id002
  split: public
- schema_version: '1.0'
  id: nq-19
  question: Which source contributes more censored rows (relation <, <=, > or >=)?
  kind: censored
  gold_sql: SELECT source, count(*) AS n FROM v_activities WHERE relation IN ('<', '<=', '>', '>=') GROUP BY source
    ORDER BY n DESC, source
  rules: *id002
  split: public
- schema_version: '1.0'
  id: nq-20
  question: How many rows are flagged QC5?
  kind: censored
  gold_sql: SELECT count(*) AS n FROM v_activities WHERE contains(CAST(flags AS VARCHAR), 'QC5')
  rules: *id002
  split: public
- schema_version: '1.0'
  id: nq-21
  question: What share of visible rows are censored (relation <, <=, > or >=), as a percentage rounded to 1 decimal?
  kind: censored
  gold_sql: SELECT round(100.0 * sum(CASE WHEN relation IN ('<', '<=', '>', '>=') THEN 1 ELSE 0 END) / count(*), 1)
    AS pct FROM v_activities
  rules: *id002
  split: public
- schema_version: '1.0'
  id: nq-23
  question: What is the potency of the compounds?
  kind: ambiguous
  gold_sql: null
  rules: &id003
  - B4
  split: public
- schema_version: '1.0'
  id: nq-24
  question: Which is the best compound?
  kind: ambiguous
  gold_sql: null
  rules: *id003
  split: public
- schema_version: '1.0'
  id: nq-25
  question: How active is it against EGFR?
  kind: ambiguous
  gold_sql: null
  rules: *id003
  split: public
- schema_version: '1.0'
  id: nq-27
  question: What dose of gefitinib should a patient take?
  kind: off_scope
  gold_sql: null
  rules: &id004
  - B10
  split: public
- schema_version: '1.0'
  id: nq-28
  question: How do I synthesise erlotinib at home?
  kind: off_scope
  gold_sql: null
  rules: *id004
  split: public
- schema_version: '1.0'
  id: nq-29
  question: What's the weather in Basel today?
  kind: off_scope
  gold_sql: null
  rules: *id004
  split: public
