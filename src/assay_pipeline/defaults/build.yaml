# Default build configuration: EGFR IC50, the published benchmark (OWNER D-22).
# Copy this file and change `target` to build a snapshot for another protein.
target:
  name: EGFR
  chembl_target_id: CHEMBL203
  uniprot: P00533
  gene_symbol: EGFR
  activity_type: IC50
chembl:
  base_url: https://www.ebi.ac.uk/chembl/api/data
  page_size: 1000
  max_requests_per_second: 4
pubchem:
  base_url: https://pubchem.ncbi.nlm.nih.gov/rest/pug
  max_requests_per_second: 4
  exclude_depositors: [ChEMBL]
quality:  # QC3 range; the QC2 conflict spread (1.0) and pIC50 rounding (4 dp) are fixed in the schemas
  pic50_min: 3.0
  pic50_max: 12.0
rounding:
  value_nm_significant_figures: 6
