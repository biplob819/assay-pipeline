[project]
name = "assay-pipeline"
version = "0.0.1"
description = "EGFR bioactivity data with provenance and quality rules, read by an AI agent through a SQL guard and a hash-chained audit log."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Biplob Chakraborty" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8,<3",
    "duckdb>=1.4",
    "evalkit-harness==0.1.0",
    "httpx>=0.27",
    "openai>=3.51,<4",
    "pyarrow>=18",
    "pydantic>=2.7",
    "pyyaml>=6",
    "rdkit>=2026.9,<2026.10",
    "sqlglot>=30.31,<31",
]

[project.urls]
Homepage = "https://github.com/biplob819/assay-pipeline"

[project.scripts]
assay = "assay_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0.12.20261113",
    "fpdf2>=2.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay_pipeline"]

[tool.hatch.build.targets.sdist]
include = ["src/assay_pipeline", "README.md", "LICENSE", "changelog.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow the › separator used in proof cells

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "contract: schema, view, CLI and public API contract tests",
    "golden: end-to-end run against recorded responses, no network",
    "rebuild: two clean snapshot builds give identical manifests",
    "security: guard corpus, oracle, permissions, audit tamper and secret tests",
]
